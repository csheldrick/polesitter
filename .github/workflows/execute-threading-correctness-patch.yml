name: Execute threading correctness patch

on:
  push:
    branches:
      - agent/threading-correctness-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/threading-correctness-followup
          fetch-depth: 0
      - run: python .github/apply_threading_correctness.py
      - run: |
          rm .github/apply_threading_correctness.py
          rm .github/workflows/apply-threading-correctness.yml
          rm .github/workflows/run-threading-correctness-patch.yml
          rm .github/workflows/execute-threading-correctness-patch.yml
          rm .github/workflows/probe.yml
          git config user.name "project-relay"
          git config user.email "csheldrick+relay@gmail.com"
          git add README.md src/polesitter.h tests/accuracy.c .github
          git commit -m "fix: tighten threading correctness and v2 docs"
          git push origin HEAD:agent/threading-correctness-followup
